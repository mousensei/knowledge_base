[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "dashscope>=1.27.7",
    "fastapi>=0.143.1",
    "grandalf>=0.8",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "mcp>=1.19.0,<2",
    "minio>=7.2.20",
    "modelscope>=1.40.2",
    "numpy>=2.4.6",
    "openai-agents>=0.23.1",
    "pymilvus[model]>=3.0.2",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sympy>=1.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
