<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>步骤5：SSE 事件属性说明</title>
    <style>
      body {
        padding: 20px;
      }

      #result {
        margin-top: 20px;
        white-space: pre-wrap;
      }

      .progress {
        color: purple;
      }

      .complete {
        color: green;
      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h3>步骤5：SSE 事件属性说明</h3>
    <input
      type="text"
      id="queryInput"
      placeholder="输入查询内容"
      value="Python SSE怎么用"
    />
    <button onclick="submitQuery()">提交查询</button>
    <div id="result"></div>

    <script>
      async function submitQuery() {
        // 1. 获取问题
        const query = document.getElementById("queryInput").value;

        // 2. 自动生成会话ID
        const sessionId = "query_" + Date.now();

        // 3. POST提交查询内容
        const response = await fetch("http://127.0.0.1:8000/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: query, session_id: sessionId }),
        });

        //4. 获取响应结果
        const resultDom = document.getElementById("result");
        if (response.ok) {
          const resultData = await response.json();
          resultDom.innerHTML += resultData.message + "<br>";
        }

        // 5. 建立SSE连接
        const eventSource = new EventSource(
          `http://127.0.0.1:8000/stream/${sessionId}`,
        );

        // 定制化监听
        eventSource.addEventListener("progress", (event) => {
          resultDom.innerHTML += `<div class = "progress">${event.data}</div>`;
        });

        // 定制化监听
        eventSource.addEventListener("complete", (event) => {
          resultDom.innerHTML += `<div class = "complete">${event.data},准备关闭链接</div>`;
          eventSource.close(); // 关闭链接
        });

        // 定制化监听
        eventSource.onerror = (event) => {
          resultDom.innerHTML += `<div class="error">连接异常：${event.message || "未知错误"}</div>`;
          eventSource.close(); // 关闭链接
        };
      }
    </script>
  </body>
</html>
