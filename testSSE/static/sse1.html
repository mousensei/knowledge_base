<!doctype html>
<html>
  <header>
    <title>sse1</title>
  </header>
  <body>
    <h3>SSE1</h3>
    <div id="result"></div>
    <button onclick="a()">点我</button>
    <script>
      function a() {
        resultDom = document.getElementById("result");
        eventSource = new EventSource("http://localhost:8000/simple_stream");
        eventSource.onmessage = function (event) {
          if (event.data === "[END]") {
            eventSource.close();
            return;
          }
          resultDom.innerHTML += event.data + "<br>";
        };
      }
    </script>
  </body>
</html>
